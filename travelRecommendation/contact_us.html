<!DOCTYPE html>
<html>
<head>
  <title>Contact Us - TravelRec</title>
  <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <div class="logo">
      <h1>TravelRec</h1>
    </div>
    <ul class="nav-links">
      <li><a href="travel_recommendation.html">Home</a></li>
      <li><a href="about_us.html">About Us</a></li>
      <li><a href="contact_us.html">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Sección de Contact Us -->
  <section class="contact-us">
    <h2>Contact Us</h2>
    <p>If you have any questions or need assistance, feel free to reach out to us. We'll get back to you as soon as possible!</p>

    <form action="#" method="POST" id="contactForm">
      <div class="form-group">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
      </div>
      
      <div class="form-group">
        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
      </div>
      
      <div class="form-group">
        <label for="message">Your Message:</label>
        <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </section>

  <script src="travel_recommendation.js"></script>
</body>
</html>
